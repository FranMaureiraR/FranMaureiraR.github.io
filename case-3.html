          document.documentElement.lang = es ? 'es' : 'en';
          document.querySelectorAll('[data-es]').forEach((el) => { el.dataset.en ??= el.textContent; el.textContent = es ? el.dataset.es : el.dataset.en; });
          const b = document.querySelector('.lang-toggle'); b.textContent = es ? 'EN' : 'ES'; b.setAttribute('aria-label', es ? 'View in English' : 'Ver en español');
          err.textContent = '';
        };
        document.querySelector('.lang-toggle').addEventListener('click', () => { es = !es; try { localStorage.setItem('fm-lang', es ? 'es' : 'en'); } catch (e) {} swap(); });
        if (es) swap();
        document.querySelector('.gate-eye').addEventListener('click', (e) => { const show = input.type === 'password'; input.type = show ? 'text' : 'password'; e.currentTarget.classList.toggle('on', show); input.focus(); });
        form.addEventListener('submit', (e) => { e.preventDefault(); err.textContent = ''; open(input.value, false); });
        // Solo recuerda la contraseña mientras la pestaña está abierta; borra la que guardaba la versión anterior
        try { localStorage.removeItem('fm-pass'); sessionStorage.removeItem('fm-pass'); } catch (e) {}
        let saved = null; try { saved = sessionStorage.getItem(KEY); } catch (e) {}
        if (saved) { document.documentElement.style.visibility = 'hidden'; open(saved, true); } else input.focus();
      </script>
    </body>
    </html>
