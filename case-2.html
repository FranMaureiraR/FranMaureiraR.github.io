        const form = document.getElementById('gate'), input = document.getElementById('pw'), err = document.querySelector('.gate-err');
        async function open(pw, silent) {
          try {
            const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
            const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", salt: bytes(P.s), iterations: P.n, hash: "SHA-256" }, base, 512));

            try { sessionStorage.setItem(KEY, pw); } catch (e) {}
            const hash = location.hash;
            document.open(); document.write(html); document.close();
            if (hash) setTimeout(() => { const t = document.getElementById(hash.slice(1)); if (t) t.scrollIntoView(); }, 300);
          } catch (e) {
            try { sessionStorage.removeItem(KEY); } catch (e2) {}
            document.documentElement.style.visibility = '';

          }
        }
        // Idioma de esta pantalla (el sitio ya descifrado usa su propio botón)
        let es = false; try { es = localStorage.getItem('fm-lang') === 'es'; } catch (e) {}
        const swap = () => {
          document.documentElement.lang = es ? 'es' : 'en';
          document.querySelectorAll('[data-es]').forEach((el) => { el.dataset.en ??= el.textContent; el.textContent = es ? el.dataset.es : el.dataset.en; });
          const b = document.querySelector('.lang-toggle'); b.textContent = es ? 'EN' : 'ES'; b.setAttribute('aria-label', es ? 'View in English' : 'Ver en español');

        };
        document.querySelector('.lang-toggle').addEventListener('click', () => { es = !es; try { localStorage.setItem('fm-lang', es ? 'es' : 'en'); } catch (e) {} swap(); });
